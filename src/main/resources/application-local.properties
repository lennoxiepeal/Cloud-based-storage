# Persistent local demo. Real cloud configuration remains separate.
server.address=0.0.0.0
server.port=8080
spring.datasource.url=jdbc:h2:file:./.local-data/database;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.globally_quoted_identifiers_skip_column_definitions=true
spring.datasource.hikari.maximum-pool-size=10
server.servlet.session.timeout=2h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
aws.s3.region=us-east-1
aws.s3.bucket-name=cloud-storage-demo
aws.s3.access-key=S3RVER
aws.s3.secret-key=S3RVER
aws.s3.endpoint=http://localhost:4569
ibm.cos.access-key=local-disabled
ibm.cos.secret-key=local-disabled
aws.sqs.queue-url=http://localhost:4569/disabled
aws.cloudwatch.enabled=false
backup.enabled=false
storage.primary-provider=S3
management.endpoints.web.exposure.include=health,metrics,prometheus
